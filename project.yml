# Quelle des Xcode-Projekts. Die .xcodeproj wird daraus erzeugt und ist
# NICHT eingecheckt - siehe docs/ENTSCHEIDUNGEN.md.
#
# Vier Apps aus einem Repo (docs/PLAN-AUFTEILUNG.md):
#   Healthy  - Essen, Gewicht, Einkaufsliste  com.fherrmann.cockpit (die alte ID, bleibt)
#   Vault    - Noten, Finanzen           com.fherrmann.vault
#   Fokus    - Habits, To-Do             com.fherrmann.fokus
#   Einkaufsliste - nur die Liste       com.fherrmann.einkauf (fuer ein zweites Handy)
#
# Neue Swift-Datei hinzufuegen: Datei in den passenden Ordner legen und
# tools/bootstrap.sh laufen lassen. Ganze Ordner sind eingebunden, keine
# Einzeldateien:
#   Shared/    was Apps UND Erweiterungen uebersetzen - darf nichts benutzen,
#              das es in einer App-Erweiterung nicht gibt (UIApplication.shared)
#   Core/      was alle Apps brauchen, aber keine Erweiterung
#   Shopping/  der Einkaufs-Tab - in Healthy UND in Einkaufsliste, sonst nirgends
#   <App>/     nur diese App
name: Cockpit

options:
  bundleIdPrefix: com.fherrmann
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Auf Projektebene, nicht nur beim App-Target: sonst scheitert das
    # Test-Bundle beim Signieren an einer fehlenden Info.plist.
    GENERATE_INFOPLIST_FILE: YES
    # Signieren. Steht hier und nicht nur in der .xcodeproj, weil die
    # generiert wird - eine Einstellung, die man in Xcode anklickt, waere
    # beim naechsten bootstrap.sh wieder weg.
    DEVELOPMENT_TEAM: ZWFV263P59
    CODE_SIGN_STYLE: Automatic
    # Auf Projektebene, damit App und Erweiterung dieselbe Version tragen.
    # Driften sie auseinander, weist iOS die Installation ab - mit einer
    # Meldung ueber CFBundleShortVersionString, die die App nennt und nicht
    # die Erweiterung.
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ohne das findet der Build den Asset-Katalog zwar, benutzt sein Icon aber
    # nicht - auf dem Homebildschirm bliebe ein weisses Feld.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

# Was alle drei Apps gemeinsam haben - einmal hier, dreimal eingehaengt.
# XcodeGen versteht YAML-Anker; ohne sie stuende jeder Block dreimal da.
_app_settings: &app_settings
  INFOPLIST_KEY_UILaunchScreen_Generation: YES
  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  # Nur Hochkant, nur iPhone.
  INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  TARGETED_DEVICE_FAMILY: "1"

# Die geteilte Keychain-Gruppe: einmal Token eingeben, in allen drei Apps da.
# Jede App traegt zusaetzlich ihre eigene Vorgabegruppe - Healthy braucht die
# alte, um die vorhandenen Eintraege in die geteilte zu holen
# (Access.migrateToSharedGroup).
_shared_group: &shared_group $(AppIdentifierPrefix)com.fherrmann.shared

_widget_info: &widget_info
  # Der Bezeichner muss UNTER NSExtension stehen. Auf oberster Ebene baut
  # und signiert alles, und die Installation bricht mit "Invalid placeholder
  # attributes" ab - einer Meldung, die nichts ueber Erweiterungen sagt.
  NSExtension:
    NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # XcodeGen schreibt sonst hart "1.0"/"1" hinein und ueberstimmt damit
  # MARKETING_VERSION - die Erweiterung traegt dann eine andere Version als
  # die App, und iOS weist die Installation ab.
  CFBundleShortVersionString: $(MARKETING_VERSION)
  CFBundleVersion: $(CURRENT_PROJECT_VERSION)

targets:
  # ---------------------------------------------------------------- Healthy
  Healthy:
    type: application
    platform: iOS
    sources:
      - path: Healthy
      - path: Core
      - path: Shared
      - path: Shopping
    dependencies:
      # embed: true legt die .appex nach Healthy.app/PlugIns/. Ohne das baut
      # die Erweiterung zwar, aber iOS findet sie nie.
      - target: HealthyWidget
        embed: true
    entitlements:
      path: Healthy/Healthy.entitlements
      properties:
        # Lesen von Gesundheitsdaten. Braucht die bezahlte Mitgliedschaft.
        com.apple.developer.healthkit: true
        # Damit weckt iOS die App, wenn ein neuer Gewichtswert geschrieben
        # wird - auch wenn sie beendet ist.
        com.apple.developer.healthkit.background-delivery: true
        # "development" passt zu einer Entwicklungssignatur; die Kennungen
        # daraus kennt NUR die APNs-Sandbox.
        aps-environment: development
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.fherrmann.cockpit
          - *shared_group
    settings:
      base:
        <<: *app_settings
        # Die alte ID: Health-Berechtigung, Push beim Kalorienzaehler und die
        # vorhandenen Kalorien-Kacheln bleiben damit unangetastet.
        PRODUCT_BUNDLE_IDENTIFIER: com.fherrmann.cockpit
        INFOPLIST_KEY_CFBundleDisplayName: Healthy
        # Der Satz, den iOS beim Nachfragen zeigt. Ohne ihn beendet sich die
        # App beim ersten HealthKit-Aufruf.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Damit dein Gewicht und deine Schritte aus Health automatisch in Healthy landen.

  HealthyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HealthyWidget
      - path: Shared
    entitlements:
      path: HealthyWidget/HealthyWidget.entitlements
      properties:
        keychain-access-groups:
          - *shared_group
    info:
      path: HealthyWidget/Info.plist
      properties: *widget_info
    settings:
      base:
        # Bleibt: so behalten die Kacheln, die schon auf dem Homebildschirm
        # liegen, ihre Erweiterung.
        PRODUCT_BUNDLE_IDENTIFIER: com.fherrmann.cockpit.widget
        INFOPLIST_KEY_CFBundleDisplayName: Healthy
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES

  # ------------------------------------------------------------------ Vault
  Vault:
    type: application
    platform: iOS
    sources:
      - path: Vault
      - path: Core
      - path: Shared
    entitlements:
      path: Vault/Vault.entitlements
      properties:
        aps-environment: development
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.fherrmann.vault
          - *shared_group
    settings:
      base:
        <<: *app_settings
        PRODUCT_BUNDLE_IDENTIFIER: com.fherrmann.vault
        INFOPLIST_KEY_CFBundleDisplayName: Vault
        # Ohne diesen Schluessel beendet iOS die App, sobald sie Face ID
        # anfordert - nicht mit einer Fehlermeldung, sondern hart.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Damit Noten und Finanzen nicht offen daliegen, wenn jemand anders das Handy in der Hand hat.

  # ------------------------------------------------------------------ Fokus
  Fokus:
    type: application
    platform: iOS
    sources:
      - path: Fokus
      - path: Core
      - path: Shared
    dependencies:
      - target: FokusWidget
        embed: true
    entitlements:
      path: Fokus/Fokus.entitlements
      properties:
        # Erinnerungen des To-Do-Dienstes. Wie bei Vault: eine neue Bundle-ID
        # mit Push braucht einmal Xcode (Schema Fokus, ⌘R), danach greift
        # install-device.sh.
        aps-environment: development
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.fherrmann.fokus
          - *shared_group
    settings:
      base:
        <<: *app_settings
        PRODUCT_BUNDLE_IDENTIFIER: com.fherrmann.fokus
        INFOPLIST_KEY_CFBundleDisplayName: Fokus

  FokusWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FokusWidget
      - path: Shared
    entitlements:
      path: FokusWidget/FokusWidget.entitlements
      properties:
        keychain-access-groups:
          - *shared_group
    info:
      path: FokusWidget/Info.plist
      properties: *widget_info
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fherrmann.fokus.widget
        INFOPLIST_KEY_CFBundleDisplayName: Fokus
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES

  # ---------------------------------------------------------- Einkaufsliste
  # Die Einkaufsliste allein - fuer das Handy von Joana, das sonst
  # nichts von diesem Server sehen soll. Ihr Token oeffnet nur diesen einen
  # Dienst. Kein Push, kein Health, keine Kachel - und deshalb auch keine
  # Xcode-Runde beim Signieren.
  Einkaufsliste:
    type: application
    platform: iOS
    sources:
      - path: Einkaufsliste
      - path: Core
      - path: Shared
      - path: Shopping
    entitlements:
      path: Einkaufsliste/Einkaufsliste.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.fherrmann.einkauf
          - *shared_group
    settings:
      base:
        <<: *app_settings
        # Die ID bleibt beim alten Namen: sie ist signiert und installiert,
        # und niemand sieht sie. Ein Wechsel machte aus einer App zwei.
        PRODUCT_BUNDLE_IDENTIFIER: com.fherrmann.einkauf
        INFOPLIST_KEY_CFBundleDisplayName: Einkaufsliste

  # ------------------------------------------------------------------ Tests
  # Ein Bundle fuer alle Unit-Tests: sie pruefen Shared und Core, und die
  # liegen in jeder App. Healthy ist der Wirt, weil sie alles davon uebersetzt.
  CockpitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Healthy

  # Je App ein UI-Test-Bundle - XCUIApplication() ist immer die App, an der
  # das Bundle haengt. Der Harness (start, scrollDown, shoot ...) liegt in
  # UITests/Harness.swift und wird in alle vier eingebunden.
  HealthyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/Harness.swift
      - path: UITests/HealthyUITests.swift
    dependencies:
      - target: Healthy
    settings:
      base:
        TEST_TARGET_NAME: Healthy

  VaultUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/Harness.swift
      - path: UITests/VaultUITests.swift
    dependencies:
      - target: Vault
    settings:
      base:
        TEST_TARGET_NAME: Vault

  FokusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/Harness.swift
      - path: UITests/FokusUITests.swift
    dependencies:
      - target: Fokus
    settings:
      base:
        TEST_TARGET_NAME: Fokus

  EinkaufslisteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/Harness.swift
      - path: UITests/EinkaufslisteUITests.swift
    dependencies:
      - target: Einkaufsliste
    settings:
      base:
        TEST_TARGET_NAME: Einkaufsliste

# Ein Schema je App. Ohne expliziten Block erzeugt xcodebuild die Schemata
# selbst - und was ein Test-Bundle dabei erbt, entscheidet dann Xcode.
schemes:
  Healthy:
    build:
      targets:
        Healthy: all
        HealthyWidget: all
    test:
      targets:
        - CockpitTests
        - HealthyUITests
    run:
      config: Debug
  Vault:
    build:
      targets:
        Vault: all
    test:
      targets:
        - VaultUITests
    run:
      config: Debug
  Fokus:
    build:
      targets:
        Fokus: all
        FokusWidget: all
    test:
      targets:
        - FokusUITests
    run:
      config: Debug
  Einkaufsliste:
    build:
      targets:
        Einkaufsliste: all
    test:
      targets:
        - EinkaufslisteUITests
    run:
      config: Debug
